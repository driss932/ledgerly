[project]
name = "ledgerly"
version = "0.1.0"
description = "Serverless double-entry banking ledger API on AWS"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
