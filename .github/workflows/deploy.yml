name: Deploy

on:
  push:
    branches: [main] # every merge to main deploys to dev
  workflow_dispatch: # manual run: choose dev or prod
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write # lets GitHub issue an OIDC token that AWS trusts
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    # Add "Required reviewers" to the prod environment in GitHub for a manual approval gate.
    environment: ${{ inputs.environment || 'dev' }}
    env:
      AWS_REGION: eu-west-2
      TF_VAR_environment: ${{ inputs.environment || 'dev' }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Authenticate to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=ledgerly/${TF_VAR_environment}.tfstate" \
            -backend-config="region=eu-west-2" \
            -backend-config="use_lockfile=true"

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false tfplan

      - name: Show API URL
        run: echo "API URL - $(terraform output -raw api_url)" >> "$GITHUB_STEP_SUMMARY"
